# Quality Gate: fails a pull request when the COBRA Risk API says the build is risky.
#
# Needs one repository Variable (Settings > Secrets and variables > Actions > Variables):
#   INGESTION_API_HOST  = public URL of cobra-core (the ngrok https URL for the demo)
# Optional demo variable:
#   DEMO_BUILD_ID       = pin the check to a build that already exists in the API's database.
#                         Remove it once every PR commit is scanned and ingested for real.
#
# There is no fallback on purpose: if INGESTION_API_HOST is missing, the check
# fails loudly instead of quietly passing.

name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  release-risk:
    name: Build, test, and check release risk
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Set this repository Variable to the real API host after deployment.
      INGESTION_API_HOST: ${{ vars.INGESTION_API_HOST || 'http://localhost:4000' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install COBRA dependencies
        run: npm ci --prefix cobra-core

      - name: Install TravelTrust dependencies
        run: npm ci
        working-directory: travel-trust-insurance

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: travel-trust-insurance

      - name: Run tests and capture coverage
        run: npm run coverage:playwright
        working-directory: travel-trust-insurance
        env:
          BUILD_VERSION: ${{ env.BUILD_ID }}
          COVERAGE_SKIP_BRIDGE_UPLOAD: "1"

      - name: Submit current build scan
        run: >
          node cobra-core/bin/submit-js-build-scan.js
          --project travel-trust-insurance
          --build "$BUILD_ID"
          --repo travel-trust
          --base-ref "$BASE_SHA"
          --build-scan-url "$INGESTION_API_HOST/build-scan"

      - name: Submit test coverage
        run: >
          node cobra-core/bin/submit-js-coverage.js
          --project travel-trust-insurance
          --build "$BUILD_ID"
          --ingest-url "$INGESTION_API_HOST/ingest"

      - name: Check Release Risk
        run: node scripts/check-release-risk.js
