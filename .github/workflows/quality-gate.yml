# Quality Gate: block pull requests when the risk API reports changed code without tests.
# How it works:
# 1. Check out the PR and prepare the Node.js runtime/dependencies.
# 2. Run the build/test placeholder and expose its build_id output.
# 3. Query GET /risk/{buildId}; the script fails closed on untested changes or API errors.
# Configure INGESTION_API_HOST as a repository Actions Variable (not a secret),
# since it is a hostname and not sensitive credential data. Replace the localhost
# fallback with the deployed Ingestion API host in Settings > Secrets and variables
# > Actions > Variables once that API is deployed.

name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  release-risk:
    name: Build, test, and check release risk
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Set this repository Variable to the real API host after deployment.
      INGESTION_API_HOST: ${{ vars.INGESTION_API_HOST || 'http://localhost:4000' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install COBRA dependencies
        run: npm ci --prefix cobra-core

      - name: Install TravelTrust dependencies
        run: npm ci
        working-directory: travel-trust-insurance

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: travel-trust-insurance

      - name: Run tests and capture coverage
        run: npm run coverage:playwright
        working-directory: travel-trust-insurance
        env:
          BUILD_VERSION: ${{ env.BUILD_ID }}
          COVERAGE_SKIP_BRIDGE_UPLOAD: "1"

      - name: Submit current build scan
        run: >
          node cobra-core/bin/submit-js-build-scan.js
          --project travel-trust-insurance
          --build "$BUILD_ID"
          --repo travel-trust
          --base-ref "$BASE_SHA"
          --build-scan-url "$INGESTION_API_HOST/build-scan"

      - name: Submit test coverage
        run: >
          node cobra-core/bin/submit-js-coverage.js
          --project travel-trust-insurance
          --build "$BUILD_ID"
          --ingest-url "$INGESTION_API_HOST/ingest"

      - name: Check Release Risk
        run: node scripts/check-release-risk.js
