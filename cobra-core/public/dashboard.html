<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>COBRA — Release Confidence</title>
<style>
  :root {
    --navy: #1f4e79;
    --navy-dark: #14324d;
    --green: #2e7d32;
    --green-bg: #e8f5e9;
    --red: #c62828;
    --red-bg: #fdecea;
    --gray-bg: #f4f6f8;
    --border: #e0e0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--gray-bg);
    color: #1a1a1a;
  }
  header {
    background: linear-gradient(135deg, var(--navy), var(--navy-dark));
    color: white;
    padding: 24px 32px;
  }
  header h1 { margin: 0; font-size: 24px; letter-spacing: 0.5px; }
  header p { margin: 4px 0 0; opacity: 0.85; font-size: 14px; }

  .controls {
    max-width: 960px;
    margin: 24px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .controls input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
  }
  .controls button {
    padding: 10px 20px;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  .controls button:hover { background: var(--navy-dark); }

  main { max-width: 960px; margin: 24px auto 60px; padding: 0 24px; }

  .verdict-banner {
    border-radius: 10px;
    padding: 24px 28px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .verdict-banner.pass { background: var(--green-bg); border: 1px solid #a5d6a7; }
  .verdict-banner.fail { background: var(--red-bg); border: 1px solid #ef9a9a; }
  .verdict-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .verdict-banner.pass .verdict-title { color: var(--green); }
  .verdict-banner.fail .verdict-title { color: var(--red); }
  .verdict-sub { font-size: 14px; color: #444; }
  .risk-score { text-align: right; }
  .risk-score .num { font-size: 32px; font-weight: 700; }
  .risk-score .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #666; }

  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .card h2 {
    margin: 0;
    padding: 14px 20px;
    font-size: 15px;
    background: #fafbfc;
    border-bottom: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 20px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
  th { color: #666; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .status-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-pill.new { background: #e3f2fd; color: #1565c0; }
  .status-pill.modified { background: #fff3e0; color: #e65100; }
  .status-pill.deleted { background: #f3e5f5; color: #6a1b9a; }
  .empty-state { padding: 30px 20px; color: #888; font-size: 14px; text-align: center; }
  .error-box { background: var(--red-bg); border: 1px solid #ef9a9a; color: var(--red); padding: 16px 20px; border-radius: 8px; margin-bottom: 20px; }
  .loading { padding: 40px; text-align: center; color: #888; }
</style>
</head>
<body>

<header>
  <h1>COBRA — Release Confidence</h1>
  <p>Language-agnostic changed-function coverage &amp; release risk</p>
</header>

<div class="controls">
  <input id="buildIdInput" type="text" placeholder="Enter build ID (e.g. demo-pass)" />
  <button id="loadBtn">Check Build</button>
</div>

<main id="main">
  <div class="loading">Enter a build ID above and click "Check Build".</div>
</main>

<script>
  const main = document.getElementById('main');
  const input = document.getElementById('buildIdInput');
  const btn = document.getElementById('loadBtn');

  async function loadBuild() {
    const buildId = input.value.trim();
    if (!buildId) return;
    main.innerHTML = '<div class="loading">Loading risk report for "' + escapeHtml(buildId) + '"...</div>';

    let data;
    try {
      const res = await fetch('/risk/' + encodeURIComponent(buildId));
      if (!res.ok) {
        main.innerHTML = '<div class="error-box">API returned HTTP ' + res.status + ' for build "' + escapeHtml(buildId) + '".</div>';
        return;
      }
      data = await res.json();
    } catch (err) {
      main.innerHTML = '<div class="error-box">Could not reach the Ingestion API: ' + escapeHtml(err.message) + '</div>';
      return;
    }

    render(data);
  }

  function render(data) {
    const untested = data.untestedChanges || [];
    const recommendations = data.testRecommendations || [];
    const riskScore = (data.riskScore === null || data.riskScore === undefined) ? null : data.riskScore;
    const isPass = untested.length === 0;

    let html = '';

    html += '<div class="verdict-banner ' + (isPass ? 'pass' : 'fail') + '">';
    html += '<div>';
    html += '<div class="verdict-title">' + (isPass ? '\u2705 Release Risk: PASS' : '\u274C Release Risk: FAIL') + '</div>';
    html += '<div class="verdict-sub">Build <strong>' + escapeHtml(data.buildId || '') + '</strong> \u2014 ' +
            (isPass ? 'all changed code has test coverage.' : untested.length + ' changed function(s) have no test coverage.') + '</div>';
    html += '</div>';
    html += '<div class="risk-score"><div class="num">' + (riskScore === null ? 'n/a' : riskScore) + '</div><div class="label">Risk Score</div></div>';
    html += '</div>';

    html += '<div class="card"><h2>Untested Code Changes (' + untested.length + ')</h2>';
    if (untested.length === 0) {
      html += '<div class="empty-state">No untested changed code was reported.</div>';
    } else {
      html += '<table><thead><tr><th>File</th><th>Function</th><th>Status</th></tr></thead><tbody>';
      for (const change of untested) {
        html += '<tr><td>' + escapeHtml(change.file || '(unknown file)') + '</td>' +
                '<td>' + escapeHtml(change.function || '(unknown function)') + '</td>' +
                '<td><span class="status-pill ' + escapeHtml(change.status || '') + '">' + escapeHtml(change.status || 'unknown') + '</span></td></tr>';
      }
      html += '</tbody></table>';
    }
    html += '</div>';

    html += '<div class="card"><h2>Test Recommendations (' + recommendations.length + ')</h2>';
    if (recommendations.length === 0) {
      html += '<div class="empty-state">No tests currently cover the changed functions for this build.</div>';
    } else {
      html += '<table><thead><tr><th>Test</th><th>Covers Changed Functions</th></tr></thead><tbody>';
      for (const rec of recommendations) {
        html += '<tr><td>' + escapeHtml(rec.testId || '') + '</td>' +
                '<td>' + (rec.coversChangedFunctions || []).map(escapeHtml).join(', ') + '</td></tr>';
      }
      html += '</tbody></table>';
    }
    html += '</div>';

    main.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  btn.addEventListener('click', loadBuild);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadBuild(); });
</script>

</body>
</html>
